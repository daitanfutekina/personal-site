# Deploy: npx wrangler deploy
# Before the contact form can send, the domain must be on Cloudflare with Email Routing on,
# and the CONTACT_TO secret (npx wrangler secret put CONTACT_TO) must be a verified
# destination address in Email Routing. It is a secret so it stays out of this public repo.
name = "liam-grant-site"
main = "worker/index.js"
compatibility_date = "2026-10-01"
workers_dev = false
routes = [
  { pattern = "bentmetalstudios.com", custom_domain = true },
  { pattern = "www.bentmetalstudios.com", custom_domain = true },
]

[assets]
directory = "./"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
CONTACT_FROM = "contact@bentmetalstudios.com"

[[send_email]]
name = "CONTACT"
