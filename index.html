<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liam Grant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Archivo: a grotesque with a width axis. Its expanded cut gives the tabs and name a wide, poster-like
     voice that suits the monospaced ASCII backdrop without looking like a default UI font. -->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
  :root { --red:#FF6B6B; --green:#7BE495; --blue:#5DADEC; --yellow:#FFE66D; --tabh: clamp(56px, 11vh, 110px); --drawer: 250px; --lip: 40px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: #f2f2f2; font-family: "Archivo", system-ui, sans-serif; overflow: hidden; }
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #000; pointer-events: none; }

  /* ---- tabs + drawers ---- */
  .tabs { position: fixed; top: 0; left: 0; right: 0; z-index: 10; display: grid; grid-template-columns: repeat(4, 1fr); }
  .tab { position: relative; --c: var(--red); }
  .tab:nth-child(2) { --c: var(--green); }
  .tab:nth-child(3) { --c: var(--blue); }
  .tab:nth-child(4) { --c: var(--yellow); }
  .tab-label { position: relative; z-index: 3; display: flex; align-items: center; justify-content: center; height: var(--tabh);
    background: var(--c); color: #141414; text-decoration: none; text-transform: uppercase; text-align: center;
    font-stretch: 125%; font-weight: 700; font-size: clamp(14px, 1.5vw, 26px); letter-spacing: .01em;
    border: 3px solid #2a2a2a; border-left-width: 0; }
  .tab:first-child .tab-label { border-left-width: 3px; }

  /* The clip hides the drawer above the tab's bottom edge; only the front lip shows at rest. */
  .clip { position: absolute; top: calc(var(--tabh) - 3px); left: 0; width: 100%; height: calc(var(--drawer) + var(--lip));
    overflow: hidden; pointer-events: none; z-index: 2; }
  .drawer { position: absolute; inset: 0; pointer-events: auto; transform: translateY(calc(-100% + var(--lip) + 3px));
    transition: transform 350ms cubic-bezier(.2,.85,.25,1); display: flex; flex-direction: column; }
  .tab.open .drawer { transform: translateY(0); }

  .tray { position: relative; flex: 1; display: flex; flex-direction: column; padding: 6px 0; overflow: hidden;
    background: color-mix(in srgb, var(--c) 16%, #0b0b0b); border: 2px solid var(--c); border-top: 0; }
  .item { display: flex; align-items: center; flex: 1 1 0; min-height: 0; padding: 0 22px; color: color-mix(in srgb, var(--c) 35%, #fff);
    text-decoration: none; text-transform: uppercase; font-stretch: 112%; font-weight: 600; font-size: 14px; letter-spacing: .06em;
    border-bottom: 1px solid color-mix(in srgb, var(--c) 28%, #0b0b0b); transition: background .12s ease, box-shadow .12s ease, color .12s ease; }
  .item:last-child { border-bottom: 0; }
  .item:hover, .item:focus-visible { outline: none; color: #fff; background: color-mix(in srgb, var(--c) 30%, #0b0b0b); box-shadow: inset 5px 0 0 var(--c); }

  .front { position: relative; flex: 0 0 var(--lip); height: var(--lip); background: color-mix(in srgb, var(--c) 78%, #000);
    border: 3px solid #2a2a2a; border-top: 2px solid var(--c); border-radius: 0 0 14px 14px; display: flex; align-items: center; justify-content: center; }
  .handle { width: 46%; height: 16px; border-radius: 10px; background: var(--c); border: 3px solid #2a2a2a;
    box-shadow: inset 0 -4px 0 #0003, 0 2px 0 #0004; }

  /* ---- hero ---- */
  .hero { position: fixed; inset: 0; z-index: 1; display: grid; place-items: center; text-align: center; pointer-events: none; padding-top: var(--tabh); }
  .hero::before { content: ""; position: absolute; width: min(1100px, 98vw); height: min(520px, 62vh);
    background: radial-gradient(ellipse at center, rgba(0,0,0,.92) 0%, rgba(0,0,0,.75) 40%, rgba(0,0,0,0) 72%); }
  .hero div { position: relative; padding: 0 16px; }
  h1 { margin: 0 0 .15em; font-stretch: 125%; font-weight: 800; font-size: clamp(40px, 6.4vw, 104px); line-height: 1; letter-spacing: .01em; color: #fff; text-transform: uppercase; }
  .hero p { margin: 0; font-weight: 400; font-stretch: 100%; font-size: clamp(16px, 2.4vw, 40px); color: #fff; }

  /* ---- bottom row ---- */
  .bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; display: flex; align-items: flex-end; justify-content: space-between;
    padding: 0 clamp(12px, 2.5vw, 40px) clamp(12px, 2.2vh, 28px); gap: 20px; pointer-events: none; }
  .bottom > * { pointer-events: auto; }
  .icons { display: flex; gap: 14px; flex: 0 0 auto; }
  .icons a { width: clamp(52px, 4.4vw, 76px); height: clamp(52px, 4.4vw, 76px); display: grid; place-items: center; border-radius: 50%; color: #141414;
    transition: transform .15s ease; }
  .icons a:hover { transform: translateY(-4px); }
  .icons a:nth-child(1) { background: var(--yellow); }
  .icons a:nth-child(2) { background: var(--blue); border-radius: 12px; }
  .icons a:nth-child(3) { background: var(--green); }
  .icons svg { width: 62%; height: 62%; fill: currentColor; }
  .featured { flex: 1 1 auto; max-width: 810px; margin: 0 auto; height: clamp(46px, 7vh, 66px); display: grid; place-items: center; background: #d9d9d9; color: #111;
    border: 3px solid #3a3a3a; border-radius: 14px; font-stretch: 112%; font-weight: 700; font-size: clamp(14px, 1.6vw, 26px); text-transform: uppercase; text-decoration: none; }
  .logo { flex: 0 0 auto; width: clamp(96px, 9vw, 160px); height: clamp(96px, 9vw, 160px); border-radius: 50%; background: var(--red); display: grid; place-items: center; }
  .logo img { width: 84%; height: 84%; object-fit: contain; }
  @media (max-width: 760px) { .tab-label { font-size: 11px; } .featured { display: none; } }
</style>
</head>
<body>

<script type="module">
  import { createAsciiBackground } from './ascii-bg.js';

  const bg = createAsciiBackground(document.getElementById('bg'));
  const cs = getComputedStyle(document.documentElement);
  document.querySelectorAll('.tab').forEach(function (tab) {
    function open() {
      tab.classList.add('open');
      const r = tab.querySelector('.tab-label').getBoundingClientRect();
      const h = parseFloat(cs.getPropertyValue('--drawer')) + parseFloat(cs.getPropertyValue('--lip'));
      bg.setRepelRect(r.left, r.bottom, r.width, h, 1);
    }
    function close() { tab.classList.remove('open'); bg.clearRepelRect(); }
    tab.addEventListener('pointerenter', open);
    tab.addEventListener('focusin', open);
    tab.addEventListener('pointerleave', close);
    tab.addEventListener('focusout', close);
  });
</script>
</body>
</html>
